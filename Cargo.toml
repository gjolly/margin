[package]
name = "rune-diff"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "d03349e25189ce1edc8c26ada6bf6d4aac72c826" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d03349e25189ce1edc8c26ada6bf6d4aac72c826", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
